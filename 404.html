<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tuty Packers and Movers — Thoothukudi</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages serves this for any unknown path (e.g. a direct link or
      // refresh on /Tutypackers/about). It re-encodes the path into a query
      // string and redirects to index.html, which decodes it back before
      // React Router mounts — so deep links and refreshes work instead of 404ing.
      var pathSegmentsToKeep = 1; // "/Tutypackers"

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
